name: Update Extension Table

on:
  push:
    paths:
      - 'scripts/extensions.csv'
    branches:
      - main
      - '**'
  pull_request:
    types: [closed]
    paths:
      - 'scripts/extensions.csv'

jobs:
  update-readme:
    # If PR is closed but not merged, skip this job.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history to allow push back to repository
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install requests tqdm
    
    - name: Run update script
      run: python scripts/update_readme.py
    
    - name: Check for changes
      id: git-check
      run: |
        if git diff --quiet profile/README.md; then
          echo "changes=false" >> $GITHUB_OUTPUT
        else
          echo "changes=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Determine branch based on trigger type
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # After PR merge, operate on target branch
          git checkout ${{ github.event.pull_request.base.ref }}
        fi
        
        # Add and commit changes
        git add profile/README.md
        git commit -m "docs: update extension table [auto]"
        
        # Push changes
        git push origin HEAD:${{ github.ref_name }}
